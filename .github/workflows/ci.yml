name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generated code is machine-owned
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | grep -E '(^|/)tests/generated/'; then
            echo "::error::A human commit touched tests/generated/**"
            exit 1
          fi
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm doctor
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  replay:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval
  golden:
    runs-on: ubuntu-latest
    needs: replay
    steps:
      - run: echo "Golden browser cases begin in Ph2."
