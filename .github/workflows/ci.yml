name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

jobs:
  guard:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: generated code is machine-owned
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$BASE"...HEAD | grep -E '(^|/)tests/generated/'; then
            echo "::error::A human commit touched tests/generated/**"
            exit 1
          fi
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm doctor
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  replay:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval
  golden:
    runs-on: ubuntu-latest
    needs: replay
    steps:
      - run: echo "Golden browser cases begin in Ph2."
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: replay
    steps:
      - run: echo "Full live replay begins when browser-backed golden cases land."
