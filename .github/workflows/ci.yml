name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      # The bootstrap commit creates the workspace; lockfile enforcement begins
      # with the first dependency-refresh commit.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm verify
